name: Database availability

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-availability
  cancel-in-progress: false

jobs:
  check-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render and check Supabase database
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://intelletrics.onrender.com' }}
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            "${BACKEND_URL%/}/health/ready"
